<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>503 — Сервис временно недоступен | FrameSpace</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/errors/error.css">
</head>
<body>
<main class="error-card server">
    <div class="brand">
        <span class="brand-mark">SH</span>
        <span>FrameSpace</span>
    </div>

    <p class="code">503</p>
    <h1>Сервис временно недоступен</h1>
    <p>FrameSpace временно не может обработать запрос. Попробуйте ещё раз через несколько минут.</p>

    <div class="actions">
        <a class="button primary" href="/">На главную</a>
    </div>

    <p class="hint">Если ошибка повторяется, сохраните время возникновения ошибки и сообщите администратору.</p>
</main>
</body>
</html>
