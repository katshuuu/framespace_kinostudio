<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>405 — Метод не поддерживается | FrameSpace</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/errors/error.css">
</head>
<body>
<main class="error-card">
    <div class="brand">
        <span class="brand-mark">SH</span>
        <span>FrameSpace</span>
    </div>

    <p class="code">405</p>
    <h1>Метод не поддерживается</h1>

    <div class="actions">
        <a class="button primary" href="/">На главную</a>

    <p class="hint">Если ошибка повторяется, сохраните время возникновения ошибки и сообщите администратору.</p>
</main>
