# Overlay для КР №3 по СПО: reverse proxy с TLS + контейнер мониторинга.
# Запуск:
#   ./deploy/scripts/deploy-spo.sh
#
# Маркер: FRAMESPACE_COMPOSE_SPO

services:

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # HTTPS только на localhost — имитация закрытого периметра сервера.
      - "127.0.0.1:8443:443"
      - "127.0.0.1:8088:80"
    volumes:
      # Проектный каталог Compose — backend/ (первый -f файл), поэтому путь через ../deploy.
      - ../deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../deploy/nginx/ssl:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://127.0.0.1/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,nosuid,nodev,size=32m
      - /var/run:rw,nosuid,nodev,size=8m
      - /tmp:rw,nosuid,nodev,size=8m
    networks:
      - backend

  # Периодически опрашивает health и пишет результат в volume (для отчёта/демо).
  health-monitor:
    image: curlimages/curl:8.12.1
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      HEALTH_URL: http://backend:8080/actuator/health
      INTERVAL_SEC: "30"
    # Логи пишем в /tmp контейнера (пользователь curl не root) и дублируем в stdout.
    command:
      - /bin/sh
      - -ec
      - |
        LOG=/tmp/health.log
        echo "health-monitor started at $$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$$LOG"
        while true; do
          TS=$$(date -u +%Y-%m-%dT%H:%M:%SZ)
          CODE=$$(curl -s -o /tmp/body -w '%{http_code}' "$$HEALTH_URL" || echo 000)
          BODY=$$(cat /tmp/body 2>/dev/null || true)
          echo "$$TS code=$$CODE body=$$BODY" | tee -a "$$LOG"
          sleep "$$INTERVAL_SEC"
        done
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
